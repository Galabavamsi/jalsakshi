# Hindi IVR prompt catalog. Keys are referenced by voice/flow.py and rendered to audio by prompts/render.py.
# Keep sentences short and plain, so they work on 8 kHz phone lines and for Chhattisgarhi speakers.
# Prompts with one number placeholder are pre-rendered for 1-9; prompts with names or two placeholders
# are rendered at call time (voice/tts.py).
version: 3
language: hi-IN
household:
  greet: "Namaste. JalSakshi se bol rahe hain. Aapke ghar ke peene ke paani ke baare mein chhote sawaal hain. Calls band karni hon to kabhi bhi nau dabaiye."
  q_water: "Aaj aapko peene ka paani mila? Haan ke liye ek, nahi ke liye do, thoda sa mila to teen dabaiye."
  q_water_house_tap: "Aaj ghar ke nal mein paani aaya? Haan ke liye ek, nahi ke liye do, thoda sa aaya to teen dabaiye."
  q_water_standpost: "Aaj sarvajanik nal mein paani aaya? Haan ke liye ek, nahi ke liye do, thoda sa aaya to teen dabaiye."
  q_water_handpump: "Aaj handpump se paani mila? Haan ke liye ek, nahi ke liye do, thoda sa mila to teen dabaiye."
  q_water_borewell: "Aaj borewell ya kuen se paani mila? Haan ke liye ek, nahi ke liye do, thoda sa mila to teen dabaiye."
  q_water_tanker: "Aaj tanker aaya aur paani mila? Haan ke liye ek, nahi ke liye do, thoda sa mila to teen dabaiye."
  q_hours: "Kitne ghante paani aaya? Shunya se nau tak number dabaiye."
  q_clean: "Paani saaf tha? Saaf ke liye ek, gandla ke liye do dabaiye."
  q_fallback: "Phir peene ka paani kahan se laaye? Doosre nal ya handpump se laaye to ek, kharid kar laaye to do, paani nahi mila to teen dabaiye."
  q_note: "Kuch aur batana ho to beep ke baad pandrah second bolein. Nahi to hash dabaiye."
  bye: "Dhanyavaad. Aapka jawab gaon ki Gram Sabha tak pahunchega."
  invalid: "Maaf kijiye, samajh nahi aaya. Phir se sunte hain."
verify:
  greet: "Namaste. JalSakshi se bol rahe hain. Aapke yahan paani ki shikayat darj thi."
  q_water: "Kya ab paani theek se mil raha hai? Haan ke liye ek, nahi ke liye do dabaiye."
  bye: "Dhanyavaad. Aapki pushti ke bina shikayat band nahi hogi."
operator:
  greet: "Namaste. JalSakshi se paani ki marammat ke liye soochna hai."
  summary_no_supply: "Paani na aane ki shikayat hai. Shikayat karne wale gharon ki sankhya: {households}."
  summary_dirty: "Gandle paani ki shikayat hai. Shikayat karne wale gharon ki sankhya: {households}."
  summary_low_pressure: "Paani bahut kam ya dheere aane ki shikayat hai. Shikayat karne wale gharon ki sankhya: {households}."
  summary_leak: "Pipe se paani risne ki shikayat hai. Shikayat karne wale gharon ki sankhya: {households}."
  summary_broken: "Pump ya handpump kharab hone ki shikayat hai. Shikayat karne wale gharon ki sankhya: {households}."
  summary_other: "Paani se judi ek shikayat hai. Shikayat karne wale gharon ki sankhya: {households}."
  number: "Yeh shikayat kramank {number} hai."
  where: "Yeh shikayat kramank {number} hai. Jagah: {place}."
  q_fixed: "Samasya theek ho gayi hai to ek dabaiye. Saamaan chahiye to do. Bijli nahi hai to teen. Pipe toota hai to chaar. Yeh aapki zimmedari nahi hai to paanch. Koi aur baat bolkar batani ho to chhah. Aapke bas mein nahi hai aur Sarpanch ki madad chahiye to saat dabaiye."
  ack_fixed: "Dhanyavaad. Hum gharon se pushti karenge, phir shikayat band hogi."
  ack_pending: "Theek hai. Marammat ho jaane par Panchayat ko batayein, phir gharon se pushti hogi."
  ack_reason: "Theek hai, kaaran darj kar liya hai. Panchayat ko bataya jayega."
  ack_not_mine: "Theek hai. Shikayat Panchayat mein sahi vyakti ko bheji jayegi."
  q_note: "Beep ke baad tees second mein apni baat batayein. Khatm hone par hash dabaiye."
  ack_note: "Dhanyavaad. Aapki baat record ho gayi hai. Ise shikayat mein likh kar Panchayat ko bataya jayega."
  ack_panchayat: "Theek hai. Yeh shikayat Sarpanch ko bheji ja rahi hai. Unhe abhi JalSakshi se call jayegi."
register:
  greet: "Namaste. Yeh JalSakshi hai, IIT Bhilai ke chhatron ka ek pilot. Yeh aapke gaon mein peene ke paani ki jaankari Gram Panchayat tak pahunchata hai."
  notice: "Kripya dhyaan se sunein. Hum aapka mobile number, aapka naam, mohalla aur gaon ka naam, aur aapke jawab rakhenge, jaise paani aaya ya nahi, aur saaf tha ya nahi. Agar aap bolkar kuch batayenge, to woh recording Sarvam AI se likhai mein badli jayegi. Yeh jaankari sirf marammat ke liye Nal Jal Mitra aur Gram Panchayat ko di jayegi, aur gaon ki report mein bina naam ke dikhegi. Aap kabhi bhi calls band kar sakte hain. Kisi bhi call mein nau dabaiye, ya isi number par missed call dekar nau dabaiye. Tab aapki jaankari hata di jayegi."
  q_age: "Kya aapki umar atthaarah saal ya usse zyada hai? Haan ke liye ek, nahi ke liye do dabaiye."
  q_consent: "Kya aap JalSakshi ki calls ke liye sehmat hain? Sehmat hain to ek dabaiye. Soochna dobara sunni ho to do. Sehmat nahi hain to teen dabaiye."
  q_access: "Aap peene ka paani zyada tar kahan se lete hain? Ghar ke nal ke liye ek, sarvajanik nal ke liye do, handpump ke liye teen, borewell ya kuen ke liye chaar, tanker ke liye paanch dabaiye."
  done: "Dhanyavaad. Aapka panjikaran ho gaya. Hum aapko roz shaam ek chhoti call karenge. Paani ki koi bhi shikayat ho to isi number par missed call dein."
  declined: "Koi baat nahi. Aapko aage koi call nahi aayegi. Dhanyavaad."
  minor: "Maaf kijiye, yeh seva sirf atthaarah saal ya usse zyada umar walon ke liye hai. Dhanyavaad."
  language_option: "{name} ke liye {n} dabaiye."
  q_intro: "Beep ke baad apna naam aur apne mohalle ya para ka naam batayein. Phir hash dabaiye."
  no_answer: "Koi jawab nahi mila, isliye panjikaran nahi hua. Dobara ke liye isi number par missed call dein. Dhanyavaad."
report:
  greet: "Namaste. JalSakshi se bol rahe hain. Aapne missed call di thi."
  menu: "Paani nahi aaya to ek dabaiye. Paani gandla hai to do. Koi aur shikayat bolkar batani ho to teen. Gaon mein aaj paani ki sthiti sunni ho to chaar. Calls band karni hon to nau dabaiye."
  ack: "Aapki shikayat darj ho gayi hai. Ise jaldi Nal Jal Mitra ko bheja jayega. Theek hone par hum aapse pushti karenge."
  number: "Aapki shikayat kramank {number} hai."
  q_note: "Beep ke baad pachchees second mein apni shikayat bolein. Khatm hone par hash dabaiye."
  note_ack: "Dhanyavaad. Aapki baat record ho gayi hai. Ise shikayat mein darj kiya jayega."
  status_unknown: "Aaj ke liye abhi poori jaankari nahi hai."
  bye: "Dhanyavaad. Paani ki shikayat ke liye kabhi bhi missed call dein."
stop:
  q_confirm: "Kya aap JalSakshi ki saari calls band karna chahte hain? Band karne ke liye nau dobara dabaiye. Nahi to shunya dabaiye."
  done: "Theek hai. Aapko ab JalSakshi se koi call nahi aayegi, aur aapki jaankari hata di jayegi. Dobara judna ho to missed call dein. Dhanyavaad."
  cancelled: "Theek hai, calls chalu rahengi. Dhanyavaad."
broadcast:
  greet: "Namaste. JalSakshi par Gram Panchayat ki ek soochna hai. Dhyaan se sunein."
  q_heard: "Soochna sun li ho to ek dabaiye. Dobara sunni ho to do dabaiye."
