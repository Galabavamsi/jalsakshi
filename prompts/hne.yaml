# Chhattisgarhi speaker (for example from Kutelabhata) must review every line before wide use.
# Same keys as hi.yaml. Read by Sarvam's Hindi voice (Devanagari script), rendered to prompts/hne/.
version: 3
language: hi-IN
numbers: ["शून्य", "एक", "दू", "तीन", "चार", "पाँच", "छै", "सात", "आठ", "नौ"]
household:
  greet: "जय जोहार। हमन जलसाक्षी ले गोठियावत हन। तुंहर घर के पिये के पानी के बारे म छोटकुन सवाल हे। कभू घलो कॉल बंद करे बर नौ दबावव।"
  q_water: "आज तुमन ला पिये के पानी मिलिस का? हव बर एक, नइ बर दू, थोरकुन मिलिस त तीन दबावव।"
  q_water_house_tap: "आज घर के नल म पानी आइस का? हव बर एक, नइ बर दू, थोरकुन आइस त तीन दबावव।"
  q_water_standpost: "आज गाँव के सार्वजनिक नल म पानी आइस का? हव बर एक, नइ बर दू, थोरकुन आइस त तीन दबावव।"
  q_water_handpump: "आज हैंडपंप ले पानी मिलिस का? हव बर एक, नइ बर दू, थोरकुन मिलिस त तीन दबावव।"
  q_water_borewell: "आज बोरवेल या कुआँ ले पानी मिलिस का? हव बर एक, नइ बर दू, थोरकुन मिलिस त तीन दबावव।"
  q_water_tanker: "आज टैंकर आइस अउ पानी मिलिस का? हव बर एक, नइ बर दू, थोरकुन मिलिस त तीन दबावव।"
  q_hours: "कतका घंटा पानी आइस? शून्य ले नौ तक नंबर दबावव।"
  q_clean: "पानी साफ रहिस का? साफ बर एक, गंदा बर दू दबावव।"
  q_fallback: "त पिये के पानी कहाँ ले लानेव? दूसर नल या हैंडपंप ले लानेव त एक, खरीद के लानेव त दू, पानी नइ मिलिस त तीन दबावव।"
  q_note: "अउ कुछु बताना हे त बीप के बाद पंदरा सेकंड बोलव। नइ त हैश दबावव।"
  bye: "धन्यवाद। तुंहर जवाब गाँव के ग्राम सभा तक पहुँचही।"
  invalid: "माफी, समझ नइ आइस। फेर ले सुनथन।"
verify:
  greet: "जय जोहार। हमन जलसाक्षी ले गोठियावत हन। तुंहर इहाँ पानी के शिकायत दर्ज रहिस।"
  q_water: "का अब पानी बने मिलत हे? हव बर एक, नइ बर दू दबावव।"
  bye: "धन्यवाद। तुंहर हामी के बिना शिकायत बंद नइ होवय।"
operator:
  greet: "जय जोहार। जलसाक्षी ले पानी के मरम्मत बर सूचना हे।"
  summary_no_supply: "पानी नइ आए के शिकायत हे। शिकायत करइया घर: {households}।"
  summary_dirty: "गंदा पानी के शिकायत हे। शिकायत करइया घर: {households}।"
  summary_low_pressure: "पानी बहुत कम या धीरे आए के शिकायत हे। शिकायत करइया घर: {households}।"
  summary_leak: "पाइप ले पानी रिसे के शिकायत हे। शिकायत करइया घर: {households}।"
  summary_broken: "पंप या हैंडपंप खराब होए के शिकायत हे। शिकायत करइया घर: {households}।"
  summary_other: "पानी ले जुड़े एक शिकायत हे। शिकायत करइया घर: {households}।"
  number: "ए शिकायत नंबर {number} हे।"
  where: "ए शिकायत नंबर {number} हे। जगा: {place}।"
  q_fixed: "समस्या ठीक हो गे हे त एक दबावव। सामान चाही त दू। बिजली नइ हे त तीन। पाइप टूटे हे त चार। ए तुंहर जिम्मेदारी नइ हे त पाँच। कुछु अउ बात बोल के बताना हे त छै। तुंहर बस म नइ हे अउ सरपंच के मदद चाही त सात दबावव।"
  ack_fixed: "धन्यवाद। हमन घर मन ले पूछबो, फेर शिकायत बंद होही।"
  ack_pending: "बने हे। मरम्मत हो जाए त पंचायत ल बतावव, फेर घर मन ले पूछे जाही।"
  ack_reason: "बने हे, कारन दर्ज कर ले हन। पंचायत ल बताए जाही।"
  ack_not_mine: "बने हे। शिकायत पंचायत म सही आदमी करा भेजे जाही।"
  q_note: "बीप के बाद तीस सेकंड म अपन बात बतावव। खतम होए म हैश दबावव।"
  ack_note: "धन्यवाद। तुंहर बात रिकॉर्ड हो गे। एला शिकायत म लिख के पंचायत ल बताए जाही।"
  ack_panchayat: "बने हे। ए शिकायत सरपंच करा भेजे जावत हे। उन ल अभी जलसाक्षी ले कॉल जाही।"
register:
  greet: "जय जोहार। ए जलसाक्षी हे, आई आई टी भिलाई के छात्र मन के एक पायलट। ए तुंहर गाँव के पिये के पानी के जानकारी ग्राम पंचायत तक पहुँचाथे।"
  notice: "धियान से सुनव। हमन तुंहर मोबाइल नंबर, तुंहर नाँव, मोहल्ला अउ गाँव के नाँव, अउ तुंहर जवाब रखबो, जइसे पानी आइस के नइ, अउ साफ रहिस के नइ। कहूँ तुमन बोल के कुछु बताहू, त ओ रिकॉर्डिंग ल सर्वम ए आई ले लिखई म बदले जाही। ए जानकारी सिरिफ मरम्मत बर नल जल मित्र अउ ग्राम पंचायत ल दे जाही, अउ गाँव के रिपोर्ट म बिना नाँव के दिखही। तुमन कभू घलो कॉल बंद कर सकथव। कोनो भी कॉल म नौ दबावव, या इही नंबर म मिस्ड कॉल दे के नौ दबावव। तब तुंहर जानकारी हटा दे जाही।"
  q_age: "का तुंहर उमर अठारह बछर या ओकर ले जादा हे? हव बर एक, नइ बर दू दबावव।"
  q_consent: "का तुमन जलसाक्षी के कॉल बर राजी हव? राजी हव त एक दबावव। सूचना फेर सुनना हे त दू। राजी नइ हव त तीन दबावव।"
  q_access: "तुमन पिये के पानी जादा करके कहाँ ले लेथव? घर के नल बर एक, सार्वजनिक नल बर दू, हैंडपंप बर तीन, बोरवेल या कुआँ बर चार, टैंकर बर पाँच दबावव।"
  done: "धन्यवाद। तुंहर नाँव दर्ज हो गे। हमन रोज संझा एक छोटकुन कॉल करबो। पानी के कोनो शिकायत होय त इही नंबर म मिस्ड कॉल देवव।"
  declined: "कोनो बात नइ। तुमन ला आगू कोनो कॉल नइ आही। धन्यवाद।"
  minor: "माफी, ए सेवा सिरिफ अठारह बछर या ओकर ले जादा उमर वाले मन बर हे। धन्यवाद।"
  language_option: "{name} बर {n} दबावव।"
  q_intro: "बीप के बाद अपन नाँव अउ अपन मोहल्ला या पारा के नाँव बतावव। फेर हैश दबावव।"
  no_answer: "कोनो जवाब नइ मिलिस, तेखर सेती नाँव दर्ज नइ होइस। फेर ले बर इही नंबर म मिस्ड कॉल देवव। धन्यवाद।"
report:
  greet: "जय जोहार। हमन जलसाक्षी ले गोठियावत हन। तुमन मिस्ड कॉल दे रहेव।"
